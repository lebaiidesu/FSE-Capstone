server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:ledger-oracle}:1521/XEPDB1
    username: ${ORACLE_APP_USER:app_user}
    password: ${ORACLE_APP_USER_PASSWORD:app_password}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
