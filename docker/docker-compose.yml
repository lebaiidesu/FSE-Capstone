services:
  # ==========================================
  # Layer 4: Datastores & In-Memory Matrix
  # ==========================================
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe-master
    environment:
      - ORACLE_PASSWORD=OraclePassword123
      - APP_USER=ledger_master
      - APP_USER_PASSWORD=MasterSecretPassword123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./../backend/src/main/resources/schema-oracle.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - ledger-net

  postgresql:
    image: postgres:15-alpine
    container_name: postgres-immutable-audit
    environment:
      - POSTGRES_DB=ledger_audit_db
      - POSTGRES_USER=audit_user
      - POSTGRES_PASSWORD=AuditSecretPassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./../backend/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - ledger-net

  redis:
    image: redis:7-alpine
    container_name: redis-idempotency-matrix
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    networks:
      - ledger-net

  # ==========================================
  # Layer 5: Event Streaming (Apache Kafka)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ledger-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-event-bus
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ledger-net

  # ==========================================
  # Layer 2 & 3: Core Engine & Microservices
  # ==========================================
  core-retail-ledger-engine:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: core-retail-ledger-app
    depends_on:
      - oracle-xe
      - postgresql
      - redis
      - kafka
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-xe:1521/XE
      - SPRING_DATASOURCE_USERNAME=ledger_master
      - SPRING_DATASOURCE_PASSWORD=MasterSecretPassword123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # ==========================================
  # Layer 6: Observability & Telemetry
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-telemetry
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ledger-net

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana-dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ledger-net

networks:
  ledger-net:
    driver: bridge

volumes:
  oracle_data:
  postgres_data:
