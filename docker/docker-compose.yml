services:
  # =========================================================================
  # Layer 4: Datastores & In-Memory Matrix
  # =========================================================================
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe-master
    environment:
      - ORACLE_PASSWORD=OraclePassword123
      - APP_USER=ledger_master
      - APP_USER_PASSWORD=MasterSecretPassword123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./../backend/src/main/resources/schema-oracle.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - ledger-net

  postgresql:
    image: postgres:15-alpine
    container_name: postgres-immutable-audit
    environment:
      - POSTGRES_DB=ledger_audit_db
      - POSTGRES_USER=audit_user
      - POSTGRES_PASSWORD=AuditSecretPassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./../backend/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - ledger-net

  redis:
    image: redis:7-alpine
    container_name: redis-idempotency-matrix
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    networks:
      - ledger-net

  # =========================================================================
  # Layer 5: Event Streaming (Apache Kafka)
  # =========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ledger-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-event-bus
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ledger-net

  # =========================================================================
  # Layer 2 & 3: Core Microservices (Distinct Dedicated Containers)
  # =========================================================================
  
  # 1. API Gateway (Single Entry Point)
  api-gateway:
    image: eclipse-temurin:17-jre-alpine
    container_name: api-gateway-container
    volumes:
      - ./../backend/target/core-retail-ledger-engine-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
      - postgresql
      - redis
      - kafka
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # 2. Auth Service Container
  auth-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: auth-service-container
    volumes:
      - ./../backend/target/core-retail-ledger-engine-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8081", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
      - redis
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=auth-service
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
      - SPRING_DATA_REDIS_HOST=redis
    networks:
      - ledger-net

  # 3. Account Service Container
  account-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: account-service-container
    volumes:
      - ./../backend/target/core-retail-ledger-engine-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8082", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
    ports:
      - "8082:8082"
    environment:
      - SPRING_APPLICATION_NAME=account-service
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
    networks:
      - ledger-net

  # 4. Transaction Service Container (Core Engine & Lock Mechanics)
  transaction-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: transaction-service-container
    volumes:
      - ./../backend/target/core-retail-ledger-engine-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8083", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
      - redis
      - kafka
    ports:
      - "8083:8083"
    environment:
      - SPRING_APPLICATION_NAME=transaction-service
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # 5. Outbox Publisher Container
  outbox-publisher:
    image: eclipse-temurin:17-jre-alpine
    container_name: outbox-publisher-container
    volumes:
      - ./../backend/target/core-retail-ledger-engine-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8084", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
      - kafka
    ports:
      - "8084:8084"
    environment:
      - SPRING_APPLICATION_NAME=outbox-publisher
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # 6. Audit Service Container (PostgreSQL Immutable Audit Consumer)
  audit-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: audit-service-container
    volumes:
      - ./../backend/target/core-retail-ledger-engine-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8085", "-jar", "/app/app.jar"]
    depends_on:
      - postgresql
      - kafka
    ports:
      - "8085:8085"
    environment:
      - SPRING_APPLICATION_NAME=audit-service
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # 7. Reconciliation Service Container
  reconciliation-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: reconciliation-service-container
    volumes:
      - ./../backend/target/core-retail-ledger-engine-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8086", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
      - postgresql
      - kafka
    ports:
      - "8086:8086"
    environment:
      - SPRING_APPLICATION_NAME=reconciliation-service
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # 8. Notification Service Container
  notification-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: notification-service-container
    volumes:
      - ./../backend/target/core-retail-ledger-engine-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8087", "-jar", "/app/app.jar"]
    depends_on:
      - postgresql
      - kafka
    ports:
      - "8087:8087"
    environment:
      - SPRING_APPLICATION_NAME=notification-service
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # =========================================================================
  # Layer 6: Observability & Telemetry
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-telemetry
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ledger-net

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana-dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ledger-net

networks:
  ledger-net:
    driver: bridge

volumes:
  oracle_data:
  postgres_data:
