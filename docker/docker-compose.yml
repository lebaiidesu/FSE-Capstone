services:
  # =========================================================================
  # Layer 1: Relational Data Stores, In-Memory Matrix & Distributed Message Bus
  # =========================================================================

  # Oracle XE 21c - Primary High-Throughput OLTP Master Ledger
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe-master
    environment:
      - ORACLE_PASSWORD=MasterSecretPassword123
      - APP_USER=ledger_master
      - APP_USER_PASSWORD=MasterSecretPassword123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - ledger-net

  # PostgreSQL 15 - Immutable Financial Audit Trail & Reconciliation Store
  postgresql:
    image: postgres:15-alpine
    container_name: postgres-immutable-audit
    environment:
      - POSTGRES_DB=ledger_audit_db
      - POSTGRES_USER=audit_user
      - POSTGRES_PASSWORD=AuditSecretPassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ledger-net

  # Redis 7 - Distributed Token Matrix & Idempotency Key Lock Engine
  redis:
    image: redis:7-alpine
    container_name: redis-idempotency-matrix
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    networks:
      - ledger-net

  # Zookeeper (Required for Kafka Broker Coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ledger-net

  # Apache Kafka - Distributed Event Streaming Backbone
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-event-bus
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ledger-net

  # =========================================================================
  # Layer 2 & 3: Microservices (Spring Cloud Gateway, Ledger Core, Consumers)
  # =========================================================================

  # 1. Spring Cloud API Gateway (Port 8080)
  api-gateway:
    image: core-retail-ledger-engine:latest
    container_name: api-gateway-container
    volumes:
      - ./../backend/gateway/target/gateway-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8080", "-jar", "/app/app.jar"]
    depends_on:
      - redis
      - auth-service
      - account-service
      - ledger-core
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - AUTH_SERVICE_URI=http://auth-service:8081
      - ACCOUNT_SERVICE_URI=http://account-service:8082
      - LEDGER_CORE_URI=http://ledger-core:8083
      - EVENT_CONSUMERS_URI=http://event-consumers:8085
    networks:
      - ledger-net

  # 2. Auth Service (Dedicated IAM / Login / Token Issuance, Port 8081)
  auth-service:
    image: core-retail-ledger-engine:latest
    container_name: auth-service-container
    volumes:
      - ./../backend/auth-service/target/auth-service-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8081", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
      - redis
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=auth-service
      - SPRING_DATASOURCE_ORACLE_URL=jdbc:oracle:thin:@//oracle-xe:1521/XEPDB1
      - SPRING_DATASOURCE_ORACLE_USERNAME=ledger_master
      - SPRING_DATASOURCE_ORACLE_PASSWORD=MasterSecretPassword123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - ledger-net

  # 3. Account Service (Customer Account & Balance Queries, Port 8082)
  account-service:
    image: core-retail-ledger-engine:latest
    container_name: account-service-container
    volumes:
      - ./../backend/account-service/target/account-service-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8082", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
    ports:
      - "8082:8082"
    environment:
      - SPRING_APPLICATION_NAME=account-service
      - SPRING_DATASOURCE_ORACLE_URL=jdbc:oracle:thin:@//oracle-xe:1521/XEPDB1
      - SPRING_DATASOURCE_ORACLE_USERNAME=ledger_master
      - SPRING_DATASOURCE_ORACLE_PASSWORD=MasterSecretPassword123
    networks:
      - ledger-net

  # 4. Ledger Core Engine (Oracle OLTP Master, Redis Idempotency, Outbox Publisher, Port 8083)
  ledger-core:
    image: core-retail-ledger-engine:latest
    container_name: ledger-core-container
    volumes:
      - ./../backend/ledger-core/target/ledger-core-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8083", "-jar", "/app/app.jar"]
    depends_on:
      - oracle-xe
      - redis
      - kafka
    ports:
      - "8083:8083"
    environment:
      - SPRING_APPLICATION_NAME=ledger-core
      - SPRING_DATASOURCE_ORACLE_URL=jdbc:oracle:thin:@//oracle-xe:1521/XEPDB1
      - SPRING_DATASOURCE_ORACLE_USERNAME=ledger_master
      - SPRING_DATASOURCE_ORACLE_PASSWORD=MasterSecretPassword123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # 3. Event Consumers (Postgres Immutable Audit + Reconciliation Sweep, Port 8085)
  event-consumers:
    image: core-retail-ledger-engine:latest
    container_name: event-consumers-container
    volumes:
      - ./../backend/event-consumers/target/event-consumers-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8085", "-jar", "/app/app.jar"]
    depends_on:
      - postgresql
      - oracle-xe
      - kafka
    ports:
      - "8085:8085"
    environment:
      - SPRING_APPLICATION_NAME=event-consumers
      - SPRING_DATASOURCE_POSTGRES_URL=jdbc:postgresql://postgresql:5432/ledger_audit_db
      - SPRING_DATASOURCE_POSTGRES_USERNAME=audit_user
      - SPRING_DATASOURCE_POSTGRES_PASSWORD=AuditSecretPassword123
      - SPRING_DATASOURCE_ORACLE_URL=jdbc:oracle:thin:@//oracle-xe:1521/XEPDB1
      - SPRING_DATASOURCE_ORACLE_USERNAME=ledger_master
      - SPRING_DATASOURCE_ORACLE_PASSWORD=MasterSecretPassword123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # 4. Notification Service (PostgreSQL Alerts Consumer, Port 8087)
  notification-service:
    image: core-retail-ledger-engine:latest
    container_name: notification-service-container
    volumes:
      - ./../backend/notification-service/target/notification-service-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-Dserver.port=8087", "-jar", "/app/app.jar"]
    depends_on:
      - postgresql
      - kafka
    ports:
      - "8087:8087"
    environment:
      - SPRING_APPLICATION_NAME=notification-service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/ledger_audit_db
      - SPRING_DATASOURCE_USERNAME=audit_user
      - SPRING_DATASOURCE_PASSWORD=AuditSecretPassword123
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ledger-net

  # =========================================================================
  # Layer 4: Observability & Telemetry
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-telemetry
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ledger-net

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana-dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - ledger-net

networks:
  ledger-net:
    driver: bridge

volumes:
  oracle_data:
  postgres_data:
