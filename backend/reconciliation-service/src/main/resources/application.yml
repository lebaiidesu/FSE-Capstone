server:
  port: 8086

spring:
  application:
    name: reconciliation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_audit_db}
    username: ${SPRING_DATASOURCE_USERNAME:audit_user}
    password: ${SPRING_DATASOURCE_PASSWORD:AuditSecretPassword123}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
