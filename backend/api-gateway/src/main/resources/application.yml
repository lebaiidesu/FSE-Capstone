server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: account-service
          uri: ${ACCOUNT_SERVICE_URI:http://account-service:8082}
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: JwtAuthenticationFilter

        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URI:http://transaction-service:8083}
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: JwtAuthenticationFilter

        - id: reconciliation-service
          uri: ${RECONCILIATION_SERVICE_URI:http://reconciliation-service:8086}
          predicates:
            - Path=/api/v1/reconciliation/**
          filters:
            - name: JwtAuthenticationFilter

        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URI:http://analytics-service:8088}
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthenticationFilter

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
