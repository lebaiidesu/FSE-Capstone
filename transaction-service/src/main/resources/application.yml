server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:ledger-oracle}:1521/XEPDB1
    username: ${ORACLE_APP_USER:app_user}
    password: ${ORACLE_APP_USER_PASSWORD:app_password}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:ledger-redis}
      port: 6379
      password: ${REDIS_PASSWORD:redis_password}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
