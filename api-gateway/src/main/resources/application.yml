server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: account-service
          uri: http://account-service:8082
          predicates:
            - Path=/api/v1/accounts/**, /api/v1/customers/**
        - id: transaction-service
          uri: http://transaction-service:8083
          predicates:
            - Path=/api/v1/transactions/**
        - id: audit-service
          uri: http://audit-service:8085
          predicates:
            - Path=/api/v1/audit/**
        - id: reconciliation-service
          uri: http://reconciliation-service:8086
          predicates:
            - Path=/api/v1/reconciliation/**
        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
